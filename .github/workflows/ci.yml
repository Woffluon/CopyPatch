name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 24]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release version contract
        run: pnpm release:check
      - name: Build packages
        run: pnpm build
      - name: Run deterministic native package tests
        run: pnpm test:unit
      - name: Prove three-run coverage stability on Windows and Linux
        if: matrix.node-version == 24 && (matrix.os == 'windows-latest' || matrix.os == 'ubuntu-latest')
        run: pnpm test:coverage:stable
      - name: Pack and validate public runtime/type exports
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/copypatch-native-packs
        run: |
          pnpm release:pack -- --out "$PACK_DIR"
          node scripts/release/verify-packed-exports.mjs --out "$PACK_DIR"
      - name: Verify native runtime contracts
        run: node scripts/verify-native-runtime.mjs
      - name: Measure browser bundles
        run: pnpm bundle
      - name: Verify bundle budget exit gate
        run: pnpm test:bundle
      - name: Audit production dependencies
        run: pnpm audit:prod

  integration:
    name: Linux integration / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copypatch
          POSTGRES_PASSWORD: copypatch
          POSTGRES_DB: copypatch_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U copypatch -d copypatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COPYPATCH_TEST_POSTGRES_URL: postgresql://copypatch:copypatch@127.0.0.1:5432/copypatch_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Refuse skipped PostgreSQL contracts when CI database is configured
        run: node scripts/verify-postgres-ci.mjs
      - run: pnpm test:coverage
      - run: pnpm build:site
      - run: pnpm test:packed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
