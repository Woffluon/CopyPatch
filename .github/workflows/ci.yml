name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copypatch
          POSTGRES_PASSWORD: copypatch
          POSTGRES_DB: copypatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copypatch -d copypatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COPYPATCH_TEST_POSTGRES_URL: postgresql://copypatch:copypatch@127.0.0.1:5432/copypatch_test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version contract
        run: pnpm release:check

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: |
          if [ "${{ matrix.node-version }}" = "24" ]; then
            pnpm typecheck
          else
            pnpm run typecheck:packages
          fi

      - name: Build documentation & demo site
        if: matrix.node-version == 24
        run: pnpm build:site

      - name: Run unit & integration tests
        run: pnpm test

      - name: Enforce coverage threshold
        run: pnpm test:coverage

      - name: Measure bundle sizes
        run: node scripts/measure-bundle.mjs

      - name: Install Playwright browsers
        if: matrix.node-version == 24
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E browser tests
        if: matrix.node-version == 24
        run: pnpm test:e2e
